  passage: 'A cellular sheaf is implemented in `simulation/pjepa_sim/representation/sheaf_toy.py`: a learned
    cover ($K=6$ k-means clusters), a 1-skeleton with 8.95 edges on average, learned linear restriction
    maps with ridge regularization, the assembled coboundary $\delta_0$, and the sheaf Laplacian $L_0
    = \delta_0^\top \delta_0$, with mean $\dim H^0 = 9.85$ and $\dim H^1 = 42.3$ on the 1-skeleton.'

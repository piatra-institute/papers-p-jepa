abstract: "The original P-JEPA proposal claimed to extend Joint Embedding Predictive Architectures (JEPA) by replacing the homogeneous target embedding with a sheaf-valued predictive state over a stratified interaction space. That framing was decorative: the implementation computed a posterior-weighted variance, not a coboundary, and the sheaf structure was never wired into a training loop. This revision discards the replacement framing and adopts a plug-in framing instead. JEPA is treated as the working substrate; each piece of embodied or causal mathematics from the original paper is implemented as an auxiliary loss, head, or sampler that can be added to a stock JEPA training loop and ablated. The paper has two kinds of content with different epistemic status. The validated content is a battery of preregistered null and negative results about a bespoke toy and the original paper's own unpublished code. The conjectured content is a *typology*: a proposed mapping from auxiliary losses to the structural assumptions they match, plus a priority order for V-JEPA-scale implementation. The typology is not a validated finding; it is a research agenda derived from inductive-bias reasoning, untested at scale, and in tension with the one place the toy can check it (H5 ranks intervention loss first yet finds it neutral on the toy). The toy evidence (5 preregistered hypothesis tests on dishworld, 8 generated JSON artifacts) shows that (i) the obstruction gate in the original paper is a no-op on every reported suite, with the \"p_jepa_stack\" agent numerically identical to a plain exact value-of-information agent; (ii) value-aware active probing beats entropy probing with paired bootstrap CI [+0.009, +0.017] across 50 deterministic seeds; (iii) the trained intervention encoder is matched within CI [+0.000, +0.005] by a frozen random projection of equal width; (iv) a real cellular sheaf reduces coboundary energy 10× as theory predicts but produces *slightly worse* downstream action choice than the raw cover (CI [−0.005, −0.004]); (v) on a small NumPy JEPA with the auxiliary losses ported as toggleable terms, the viability head shows a positive trend (CI [−0.007, +0.10]) while the bisimulation regularizer at the chosen weight is mis-calibrated and hurts (CI [−0.23, −0.03]). The toy is at its variance limit and these results are *directional* signals for V-JEPA-scale ablation, not quantitative rankings. The paper closes with a conjectured priority order for V-JEPA implementation: intervention loss first, composition consistency and active masking next, sheaf consistency on overlapping clips conditional on the H4 boundary, bisimulation with curriculum tuning, viability head last (or first if the downstream is safety-critical). This order is a hypothesis from inductive-bias reasoning, not a measured ranking, and is partly contradicted by the toy. The null and negative results are gated by `docs/HYPOTHESIS_RESULTS.md`; the priority order is offered as a conjecture."
